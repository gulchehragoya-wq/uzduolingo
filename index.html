<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Ingliz Tili - Mini App</title>
  <script src="https://telegram.org"></script>
  <style>
    :root {
      --green: #58cc02;
      --green-dark: #46a302;
      --red: #ff4b4b;
      --red-dark: #ea2b2b;
      --blue: #1cb0f6;
      --blue-dark: #1899d6;
      --gray: #e5e5e5;
      --text: #3c3c3c;
      --bg: #ffffff;
    }

    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 20px;
      border-bottom: 2px solid var(--gray);
      font-weight: bold;
      font-size: 18px;
      background: #fff;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .stat-xp { color: #ff9600; }
    .stat-hearts { color: var(--red); }

    .container {
      flex: 1;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .levels-map {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      margin-top: 15px;
      width: 100%;
      padding-bottom: 30px;
    }

    .level-btn {
      width: 85px;
      height: 85px;
      border-radius: 50%;
      border: none;
      background-color: var(--green);
      box-shadow: 0 6px 0 var(--green-dark);
      color: white;
      font-size: 24px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto;
    }

    .level-btn:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 var(--green-dark);
    }

    .level-btn.locked {
      background-color: #d7d7d7;
      box-shadow: 0 6px 0 #afafaf;
      color: #888;
      cursor: not-allowed;
    }

    .level-title {
      font-size: 15px;
      margin-top: 8px;
      font-weight: 600;
      color: #555;
      text-align: center;
    }

    .lesson-screen {
      display: none;
      flex-direction: column;
      width: 100%;
      max-width: 500px;
      flex: 1;
      justify-content: space-between;
    }

    .progress-bar {
      width: 100%;
      height: 14px;
      background: var(--gray);
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 20px;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: var(--green);
      transition: width 0.3s;
    }

    .question-box {
      text-align: center;
      margin: 10px 0;
    }

    .question-type {
      font-size: 14px;
      color: #777;
      text-transform: uppercase;
      font-weight: bold;
    }

    .question-text {
      font-size: 24px;
      font-weight: bold;
      margin: 15px 0;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
    }

    .option-btn {
      padding: 16px;
      border: 2px solid var(--gray);
      border-bottom: 4px solid var(--gray);
      border-radius: 14px;
      background: white;
      font-size: 18px;
      font-weight: 600;
      text-align: left;
      cursor: pointer;
    }

    .option-btn.selected {
      border-color: var(--blue);
      background-color: #ddf4ff;
      color: var(--blue-dark);
    }

    .speaking-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      margin-top: 10px;
    }

    .listen-btn {
      background: var(--blue);
      box-shadow: 0 4px 0 var(--blue-dark);
      color: white;
      border: none;
      padding: 12px 22px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .mic-btn {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      border: none;
      background: var(--blue);
      box-shadow: 0 6px 0 var(--blue-dark);
      color: white;
      font-size: 36px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .mic-btn.recording {
      background: var(--red);
      box-shadow: 0 6px 0 var(--red-dark);
    }

    .spoken-result {
      font-size: 16px;
      color: #555;
      min-height: 24px;
      font-style: italic;
      text-align: center;
    }

    .footer {
      padding: 15px 0;
      width: 100%;
    }

    .check-btn {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 14px;
      background: var(--green);
      box-shadow: 0 5px 0 var(--green-dark);
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    .check-btn:disabled {
      background: var(--gray);
      box-shadow: 0 5px 0 #ccc;
      color: #999;
    }

    .feedback {
      display: none;
      padding: 15px;
      border-radius: 14px;
      margin-bottom: 12px;
      font-weight: bold;
      font-size: 18px;
      text-align: center;
    }

    .feedback.correct {
      background: #d7ffb8;
      color: var(--green-dark);
    }

    .feedback.wrong {
      background: #ffdfe0;
      color: var(--red-dark);
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="stat-xp">⚡ <span id="xp-count">0</span> XP</div>
    <div id="header-title">Ingliz Tili</div>
    <div class="stat-hearts">❤️ <span id="hearts-count">5</span></div>
  </div>

  <div class="container" id="home-screen">
    <div class="levels-map" id="levels-container"></div>
  </div>

  <div class="container lesson-screen" id="lesson-screen">
    <div style="width: 100%;">
      <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
      <div class="question-box">
        <div class="question-type" id="q-type">Tarjima qiling</div>
        <div class="question-text" id="q-text">Savol matni</div>
      </div>

      <div class="options" id="options-container"></div>

      <div class="speaking-box" id="speaking-container" style="display: none;">
        <button class="listen-btn" onclick="speakText()">🔊 Tinglash</button>
        <button class="mic-btn" id="mic-btn" onclick="startListening()">🎙️</button>
        <div class="spoken-result" id="spoken-text">Mikrofonni bosib gapiring...</div>
      </div>
    </div>

    <div class="footer">
      <div class="feedback" id="feedback-box"></div>
      <button class="check-btn" id="action-btn" onclick="handleAction()" disabled>TEKSHIRISH</button>
    </div>
  </div>

  <script>
    try {
      if (window.Telegram && window.Telegram.WebApp) {
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();
      }
    } catch (e) {}

    var xp = 0;
    var hearts = 5;
    var unlockedLevel = 1;
    var currentLevel = 1;
    var currentQuestionIndex = 0;
    var selectedOption = null;
    var spokenResultText = "";
    var isAnswerChecked = false;

    var levelsData = [
      {
        id: 1,
        title: "1-bosqich: Salomlashish",
        questions: [
          { type: "test", prompt: "«Hello» so‘zining tarjimasi nima?", options: ["Xayr", "Salom", "Rahmat"], answer: "Salom" },
          { type: "speak", prompt: "Talaffuz qiling: «Good morning»", target: "good morning" },
          { type: "test", prompt: "«How are you?» nima degani?", options: ["Ismingiz nima?", "Qayerdansiz?", "Ishlaringiz qalay?"], answer: "Ishlaringiz qalay?" }
        ]
      },
      {
        id: 2,
        title: "2-bosqich: Tanishuv",
        questions: [
          { type: "test", prompt: "«My name is Ali» tarjimasi:", options: ["Mening ismim Ali", "Uning ismi Ali", "Men Aliman"], answer: "Mening ismim Ali" },
          { type: "speak", prompt: "Talaffuz qiling: «Nice to meet you»", target: "nice to meet you" },
          { type: "test", prompt: "«Where are you from?»", options: ["Nechi yoshdasiz?", "Qayerdansiz?", "Nima ish qilasiz?"], answer: "Qayerdansiz?" }
        ]
      },
      {
        id: 3,
        title: "3-bosqich: Kundalik so‘zlar",
        questions: [
          { type: "test", prompt: "«Thank you very much»", options: ["Kechirasiz", "Katta rahmat", "Marhamat"], answer: "Katta rahmat" },
          { type: "speak", prompt: "Talaffuz qiling: «I love learning English»", target: "i love learning english" },
          { type: "test", prompt: "«Water» so‘zi nima?", options: ["Non", "Choy", "Suv"], answer: "Suv" }
        ]
      },
      {
        id: 4,
        title: "4-bosqich: Raqamlar va Vaqt",
        questions: [
          { type: "test", prompt: "«Today» so‘zining ma'nosi:", options: ["Ertaga", "Bugun", "Kecha"], answer: "Bugun" },
          { type: "speak", prompt: "Talaffuz qiling: «What time is it»", target: "what time is it" },
          { type: "test", prompt: "«Ten» nechchi raqami?", options: ["5", "10", "20"], answer: "10" }
        ]
      },
      {
        id: 5,
        title: "5-bosqich: Yakuniy sinov",
        questions: [
          { type: "speak", prompt: "Talaffuz qiling: «I am ready»", target: "i am ready" },
          { type: "test", prompt: "«See you tomorrow»", options: ["Ertaga ko‘rishamiz", "Xayrli tun", "Yaxshi boring"], answer: "Ertaga ko‘rishamiz" },
          { type: "speak", prompt: "Talaffuz qiling: «Have a nice day»", target: "have a nice day" }
        ]
      }
    ];

    function renderLevels() {
      var container = document.getElementById("levels-container");
      container.innerHTML = "";
      for (var i = 0; i < levelsData.length; i++) {
        (function(lvl) {
          var isLocked = lvl.id > unlockedLevel;
          var wrapper = document.createElement("div");
